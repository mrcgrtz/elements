# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
    # Maintain dependencies for Node
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'monthly'
          time: '05:00'
          timezone: 'Europe/Berlin'
      open-pull-requests-limit: 10
      assignees:
          - 'mrcgrtz'
      labels:
          - 'dependencies'
          - 'javascript'
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      cooldown:
          default-days: 5
          semver-major-days: 14
      ignore:
          # TypeScript 7.0 is not supported by our tooling yet.
          - dependency-name: 'typescript'
            versions:
                - '7.0.x'
      groups:
          # Families that must move in lockstep, majors included.
          # Scoped wildcards such as '@scope/*' stopped matching in the
          # 2026-09-30 run, so each scoped member is also listed literally.
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@vitejs/plugin-react'
          storybook:
              patterns:
                  - 'storybook'
                  - '@storybook/*'
                  - '@storybook/addon-a11y'
                  - '@storybook/builder-vite'
                  - '@storybook/react-vite'
                  - 'eslint-plugin-storybook'
          stylelint:
              patterns:
                  - 'stylelint'
                  - 'stylelint-*'
          testing-library:
              patterns:
                  - '@testing-library/*'
                  - '@testing-library/dom'
                  - '@testing-library/react'
                  - '@testing-library/user-event'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - '@vitest/coverage-istanbul'
          # Everything else, majors excluded so auto-merge keeps working.
          js-production:
              dependency-type: 'production'
              update-types:
                  - 'minor'
                  - 'patch'
          js-development:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'

    # Check for updates to GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'
          time: '06:00'
          timezone: 'Europe/Berlin'
      assignees:
          - 'mrcgrtz'
      labels:
          - 'dependencies'
          - 'github_actions'
      commit-message:
          prefix: 'chore(deps)'
      cooldown:
          default-days: 5
      groups:
          github-actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
